version: '3.8'

services:
  jarvis-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-agent
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./.jarvis-conversations:/app/.jarvis-conversations
      - ./logs:/app/logs
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
