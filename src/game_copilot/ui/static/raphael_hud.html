<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raphael AI - Wisdom Lord Gaming HUD (Tensura Edition)</title>
  <style>
    :root {
      --bg-glass: rgba(10, 14, 26, 0.88);
      --border-cyan: #00f0ff;
      --glow-cyan: rgba(0, 240, 255, 0.5);
      --accent-gold: #ffd166;
      --glow-gold: rgba(255, 209, 102, 0.4);
      --danger-crimson: #ff2a6d;
      --text-main: #f8fafc;
      --text-dim: #7dd3fc;
      --text-subtitle: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: 'Meiryo', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 24px;
    }

    /* Floating HUD Container at Top-Left */
    .raphael-hud {
      position: relative;
      width: 480px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--border-cyan);
      box-shadow: 0 0 25px var(--glow-cyan), inset 0 0 15px rgba(0, 240, 255, 0.15);
      border-radius: 12px;
      padding: 16px 20px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0.95;
    }

    .raphael-hud.warning {
      border-color: var(--danger-crimson);
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.6), inset 0 0 15px rgba(255, 42, 109, 0.2);
    }

    .raphael-hud.celebration {
      border-color: var(--accent-gold);
      box-shadow: 0 0 25px var(--glow-gold), inset 0 0 15px rgba(255, 209, 102, 0.25);
    }

    /* Idle Breathing Effect */
    .raphael-hud.idle {
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
      animation: idleBreathe 4s ease-in-out infinite;
    }

    @keyframes idleBreathe {
      0%, 100% { border-color: rgba(0, 240, 255, 0.5); box-shadow: 0 0 15px rgba(0, 240, 255, 0.25); }
      50% { border-color: rgba(0, 240, 255, 0.9); box-shadow: 0 0 25px rgba(0, 240, 255, 0.55); }
    }

    /* Header Bar */
    .hud-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    /* Tensura Magic Rune Circle */
    .rune-container {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rune-svg {
      width: 100%;
      height: 100%;
      animation: rotateRune 12s linear infinite;
      transform-origin: center;
    }

    .rune-inner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f0ff 10%, rgba(0, 240, 255, 0.2) 70%, transparent);
      animation: pulseRune 2s ease-in-out infinite;
    }

    @keyframes rotateRune {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseRune {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00f0ff); }
    }

    /* Title & Game Indicator */
    .title-block {
      flex: 1;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-title span.kanji {
      font-size: 13px;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .game-status {
      font-size: 11px;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff88;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Audio Waves Animation */
    .audio-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
      margin-left: auto;
    }

    .bar {
      width: 2px;
      height: 100%;
      background: var(--border-cyan);
      border-radius: 1px;
      animation: wave 1s ease-in-out infinite;
    }
    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar:nth-child(4) { animation-delay: 0.45s; }

    @keyframes wave {
      0%, 100% { height: 3px; }
      50% { height: 14px; }
    }

    /* Message Body */
    .message-box {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .event-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.15);
      color: var(--border-cyan);
      margin-bottom: 6px;
      width: fit-content;
      text-transform: uppercase;
    }

    /* Japanese Voice Line */
    .speech-bubble-jp {
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      letter-spacing: 0.5px;
    }

    .speech-bubble-jp .notice-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 4px;
    }

    /* English Subtitle Line */
    .speech-bubble-en {
      font-size: 12.5px;
      line-height: 1.4;
      font-weight: 500;
      font-style: italic;
      color: var(--text-subtitle);
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 209, 102, 0.2);
    }

    /* Telemetry Strip */
    .telemetry-strip {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 240, 255, 0.15);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="raphaelHud" class="raphael-hud idle">
    <!-- Header -->
    <div class="hud-header">
      <div class="rune-container">
        <!-- Tensura Magic Circle SVG -->
        <svg class="rune-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 4"/>
          <circle cx="50" cy="50" r="38" stroke="#ffd166" stroke-width="1" stroke-dasharray="3 3"/>
          <polygon points="50,14 81,68 19,68" stroke="#00f0ff" stroke-width="1.2" opacity="0.8"/>
          <polygon points="50,86 19,32 81,32" stroke="#00f0ff" stroke-width="1.2" opacity="0.8"/>
          <circle cx="50" cy="50" r="26" stroke="#00f0ff" stroke-width="1"/>
        </svg>
        <div class="rune-inner"></div>
      </div>

      <div class="title-block">
        <div class="hud-title">
          <span>Raphael</span>
          <span class="kanji">« 智恵之王 »</span>
        </div>
        <div class="game-status">
          <div class="status-dot"></div>
          <span id="gameNameText">IDLE • SOUL LINK STABLE</span>
        </div>
      </div>

      <div class="audio-waves" id="audioWaves" style="opacity: 0.5;">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <!-- Message Body -->
    <div class="message-box">
      <div id="eventBadge" class="event-badge">STANDBY</div>
      <div id="speechTextJp" class="speech-bubble-jp">
        <span class="notice-tag">&lt;告。</span> 魂の回廊（ソウルリンク）は極めて安定しています。戦況を常時観測中です、マスター。&gt;
      </div>
      <div id="speechTextEn" class="speech-bubble-en">
        [Subtitle] &lt;Notice. Soul corridor is fully stabilized. Actively monitoring field telemetry, Master.&gt;
      </div>
    </div>

    <!-- Telemetry Strip -->
    <div id="telemetryStrip" class="telemetry-strip">
      <span id="telemetryDetail1">STATUS: OPTIMAL</span>
      <span id="telemetryDetail2">SOUL LINK: 100%</span>
      <span id="telemetryDetail3">MONITORING</span>
    </div>
  </div>

  <script>
    let idleTimer = null;

    // Harmonic Tensura notification chime
    function playRaphaelChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const freqs = [880, 1320, 1760];
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.08, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.65);
        });
      } catch (e) {
        console.warn("Autoplay audio chime prevented:", e);
      }
    }

    function setIdleMode() {
      const hud = document.getElementById('raphaelHud');
      const gameText = document.getElementById('gameNameText');
      const badge = document.getElementById('eventBadge');
      const speechJp = document.getElementById('speechTextJp');
      const speechEn = document.getElementById('speechTextEn');
      const strip1 = document.getElementById('telemetryDetail1');
      const strip2 = document.getElementById('telemetryDetail2');
      const strip3 = document.getElementById('telemetryDetail3');

      hud.className = 'raphael-hud idle';
      gameText.innerText = "IDLE • SOUL LINK STABLE";
      badge.innerText = "STANDBY";
      speechJp.innerHTML = '<span class="notice-tag">&lt;告。</span> 魂の回廊（ソウルリンク）は安定。戦況を常時観測中です、マスター。&gt;';
      speechEn.innerHTML = '[Subtitle] &lt;Notice. Soul corridor is stable. Actively monitoring field telemetry, Master.&gt;';
      strip1.innerText = "STATUS: OPTIMAL";
      strip2.innerText = "SOUL LINK: 100%";
      strip3.innerText = "MONITORING";
    }

    // Function called to display new reactive feedback from Raphael
    window.updateRaphaelHUD = function(payload) {
      if (idleTimer) clearTimeout(idleTimer);

      const hud = document.getElementById('raphaelHud');
      const gameText = document.getElementById('gameNameText');
      const badge = document.getElementById('eventBadge');
      const speechJp = document.getElementById('speechTextJp');
      const speechEn = document.getElementById('speechTextEn');
      const strip1 = document.getElementById('telemetryDetail1');
      const strip2 = document.getElementById('telemetryDetail2');
      const strip3 = document.getElementById('telemetryDetail3');
      const waves = document.getElementById('audioWaves');

      hud.className = 'raphael-hud';
      if (payload.severity === 'CRITICAL' || payload.severity === 'WARNING') {
        hud.classList.add('warning');
      } else if (payload.severity === 'CELEBRATION') {
        hud.classList.add('celebration');
      }

      gameText.innerText = (payload.game_name || "GAME").toUpperCase() + " • ACTIVE";
      badge.innerText = payload.event_type || "TELEMETRY";

      // Japanese Voice Text
      let textJp = payload.reaction_jp || payload.reaction || payload.summary || "";
      textJp = textJp.replace(/<告[。、\.]?/gi, '<span class="notice-tag">&lt;告。</span>')
                     .replace(/<解[。、\.]?/gi, '<span class="notice-tag">&lt;解。</span>')
                     .replace(/<報告[。、\.]?/gi, '<span class="notice-tag">&lt;報告。</span>')
                     .replace(/<警告[。、\.]?/gi, '<span class="notice-tag" style="color:#ff2a6d">&lt;警告。</span>');
      speechJp.innerHTML = textJp;

      // English Subtitle
      let textEn = payload.reaction_en || "";
      speechEn.innerHTML = textEn ? `[Subtitle] ${textEn}` : "";

      // Telemetry Strip
      if (payload.details && Object.keys(payload.details).length > 0) {
        const d = payload.details;
        if (d.lap_time_str) {
          strip1.innerText = "LAP: " + d.lap_time_str;
          strip2.innerText = "DELTA: " + (d.delta_prev_lap >= 0 ? "+" : "") + Number(d.delta_prev_lap || 0).toFixed(3) + "s";
          strip3.innerText = d.is_personal_best ? "BEST LAP" : "P" + (d.position || 1);
        } else if (d.cause) {
          strip1.innerText = "STATUS: CASUALTY";
          strip2.innerText = "CAUSE: " + d.cause.toUpperCase();
          strip3.innerText = "RESPAWNING...";
        } else if (d.achievement) {
          strip1.innerText = "UNLOCK: ADVANCEMENT";
          strip2.innerText = d.achievement.toUpperCase();
          strip3.innerText = "REWARD: GRANTED";
        }
      }

      playRaphaelChime();
      waves.style.opacity = '1';
      setTimeout(() => { waves.style.opacity = '0.5'; }, 2500);

      // Return to Idle state after 9 seconds of inactivity
      idleTimer = setTimeout(setIdleMode, 9000);
    };

    function connectEventStream() {
      try {
        const evtSource = new EventSource("/api/game_copilot/stream");
        evtSource.onmessage = function(e) {
          try {
            const data = JSON.parse(e.data);
            window.updateRaphaelHUD(data);
          } catch (err) {
            console.error("Error parsing event stream:", err);
          }
        };
        evtSource.onerror = function() {
          setTimeout(connectEventStream, 3000);
        };
      } catch (e) {
        console.warn("EventSource stream not yet active:", e);
      }
    }
    connectEventStream();
  </script>
</body>
</html>
