logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{extra[source]: <16}</cyan> - <level>{message}</level>"
  file_format: "[{time:YYYY-MM-DD HH:mm:ss.SSS}] [{level: <8}] [{extra[source]: <16}] {message}"
  file_path: "logs/jarvis-{time:YYYY-MM-DD}.log"
  rotation: "10 MB"
  retention: "7 days"
  compression: "zip"
  backtrace: true
  diagnose: true
